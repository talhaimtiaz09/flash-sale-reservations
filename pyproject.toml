# Tool config only; the Lambdas have no dependencies beyond boto3, which the
# Python 3.13 runtime already ships. Dev tools: lambdas/requirements-dev.txt.

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["lambdas", "lambdas/reserve", "lambdas/confirm", "lambdas/get_sale", "lambdas/release", "lambdas/sweeper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["helpers", "shared", "reserve", "confirm", "get_sale", "release", "sweeper"]

[tool.pytest.ini_options]
testpaths = ["lambdas/tests"]
addopts = "-q"
