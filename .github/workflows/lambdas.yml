# Lambda code and scripts: ruff (lint + format check) and the pytest suite.
#
# The tests run against moto's in-memory DynamoDB, so this workflow needs no
# AWS access at all. Python matches the Lambda runtime (3.13).
#
# Actions are pinned to full commit SHAs (tag in the trailing comment).

name: lambdas

on:
  pull_request:
    paths:
      - "lambdas/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/lambdas.yml"
  push:
    branches: [main]
    paths:
      - "lambdas/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/lambdas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ruff / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lambdas/requirements-dev.txt

      - name: Install dev tools
        run: pip install -r lambdas/requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      - name: pytest
        run: pytest
